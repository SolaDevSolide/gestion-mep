# Lancement complet (dev ou recette) : docker compose up --build
# Puis ouvrir http://localhost:8080 (comptes de démonstration : DEMO=true dans un fichier .env, voir README)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestion_mep
      POSTGRES_USER: ${POSTGRES_USER:-mep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mep}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mep} -d gestion_mep"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${MEP_IMAGE:-gestion-mep:local}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Mep: Host=db;Port=5432;Database=gestion_mep;Username=${POSTGRES_USER:-mep};Password=${POSTGRES_PASSWORD:-mep}
      Demo__Activer: ${DEMO:-false}
      Admin__Login: ${ADMIN_LOGIN:-}
      Admin__MotDePasse: ${ADMIN_MOT_DE_PASSE:-}
      Stockage__Dossier: /data/pieces-jointes
      Stockage__TailleMaxMo: ${PIECES_TAILLE_MAX_MO:-20}
      # Plafonds des pièces jointes (Mo, 0 = sans limite) et espace disque toujours laissé libre
      Stockage__QuotaMepMo: ${PIECES_QUOTA_MEP_MO:-1024}
      Stockage__QuotaCompteJourMo: ${PIECES_QUOTA_COMPTE_JOUR_MO:-1024}
      Stockage__EspaceLibreMinMo: ${PIECES_ESPACE_LIBRE_MIN_MO:-2048}
      # Compression sans perte des pièces jointes (gain minimal en %, sinon le fichier reste tel quel)
      Stockage__Compression: ${PIECES_COMPRESSION:-true}
      Stockage__CompressionGainMin: ${PIECES_COMPRESSION_GAIN_MIN:-10}
      Cles__Dossier: /data/cles
      # Sauvegardes automatiques avant une mise à jour du schéma ou une importation (supprimées si les contrôles passent)
      Sauvegardes__Dossier: /data/sauvegardes
      # Réseaux du reverse proxy HTTPS, seuls autorisés à transmettre l'adresse du client (X-Forwarded-For)
      ProxyInverse__Reseaux: ${PROXY_RESEAUX:-172.16.0.0/12}
      Connexion__TentativesParMinute: ${CONNEXIONS_PAR_MINUTE:-20}
      # Indicateur de nouvelle version (lit les versions publiées sur GitHub) et lien « Signaler un problème ou une idée »
      MisesAJour__Verifier: ${VERIFIER_MISES_A_JOUR:-true}
      Signalement__Lien: ${LIEN_SIGNALEMENT-https://github.com/SolaDevSolide/gestion-mep/issues/new/choose}
      # Échanges avec le service « mise-a-jour » (bouton « Mettre à jour » de la console, s'il est activé)
      MisesAJour__Dossier: /data/mise-a-jour
      # Adresse publique (https://mep.entreprise.fr) : sert à l'adresse de retour de la connexion unique ; vide, déduite de la requête
      Application__UrlPublique: ${URL_PUBLIQUE:-}
      Flux__ConnexionsMax: ${FLUX_MAX:-1000}
      # false : mode d'essai sans reverse proxy, la session fonctionne en http simple (mots de passe en clair)
      Securite__HttpsObligatoire: ${HTTPS_OBLIGATOIRE:-true}
      # Connexions aux API externes : réseaux internes qu'elles peuvent joindre (vide : aucun), proxy sortant, historique des
      # appels (jours) et interrupteur général des envois (false : les appels restent en file)
      ConnexionsApi__ReseauxAutorises: ${API_RESEAUX_AUTORISES:-}
      ConnexionsApi__Proxy: ${API_PROXY:-}
      ConnexionsApi__ConservationJours: ${API_APPELS_CONSERVATION_JOURS:-90}
      ConnexionsApi__EnvoisActifs: ${API_ENVOIS_ACTIFS:-true}
      # Les réglages ci-dessus marqués (console) dans .env.example se modifient aussi depuis la console ou « gestion-mep reglages ».
    volumes:
      - pieces-jointes:/data/pieces-jointes
      - cles:/data/cles
      - sauvegardes:/data/sauvegardes
      - mise-a-jour:/data/mise-a-jour
      # Facultatif : charte visuelle (couleurs de l'application et des exports Excel), fichier charte.json posé à côté
      # de ce fichier. Décommenter la ligne, puis « docker compose up -d ». Voir docs/Exploiter.md#charte-visuelle.
      # - ./charte.json:/etc/gestion-mep/charte.json:ro
    # Publié sur 127.0.0.1 par défaut : seul un reverse proxy HTTPS de la même machine y accède (voir ADRESSE_ECOUTE dans .env.example).
    ports:
      - "${ADRESSE_ECOUTE:-127.0.0.1}:${PORT:-8080}:8080"
    restart: unless-stopped

  # Facultatif : mise à jour depuis la console d'administration. Désactivé par défaut ; l'activer avec
  # COMPOSE_PROFILES=mise-a-jour dans .env. Il a accès à Docker (socket) pour remplacer le conteneur « app ».
  # Image (MEP_IMAGE_MISE_A_JOUR) : celle de la version installée, déjà fixée dans les fichiers joints à chaque version
  # publiée ; le service la fait suivre lui-même à chaque mise à jour. Le fichier du dépôt la construit sur place.
  mise-a-jour:
    image: ${MEP_IMAGE_MISE_A_JOUR:-gestion-mep-mise-a-jour:local}
    build: ./mise-a-jour
    profiles: [mise-a-jour]
    environment:
      # Seul dépôt d'images installé (registre interne possible)
      MEP_DEPOT_IMAGE: ${MEP_DEPOT_IMAGE:-ghcr.io/soladevsolide/gestion-mep}
      # Secondes d'attente de la sonde « prête » après le démarrage de la nouvelle version (la sauvegarde et la migration,
      # faites avant, sont attendues sans limite)
      MEP_ATTENTE_SANTE: ${MEP_ATTENTE_SANTE:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Dossier de ce fichier (.env, docker-compose.override.yml, charte.json…) : la recréation de l'application y lit
      # les mêmes fichiers et y résout les chemins relatifs comme un « docker compose up -d » lancé à la main.
      - .:/projet
      - mise-a-jour:/echange
    restart: unless-stopped

volumes:
  db-data:
  pieces-jointes:
  cles:
  sauvegardes:
  mise-a-jour:
