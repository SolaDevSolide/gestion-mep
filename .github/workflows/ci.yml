name: CI

on:
  push:
    branches: [main]
    # Une étiquette « v1.2.0 » publie la version 1.2.0 : image numérotée, puis version GitHub (« release ») avec ses notes.
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Tests .NET
        working-directory: backend
        run: dotnet test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatage
        run: npm run format:check
      - name: Types de l'API à jour avec docs/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || { echo "::error::src/api/schema.d.ts n'est pas à jour : lancer npm run api:types dans frontend."; exit 1; }
      - run: npm test
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Seul ce job publie l'image : les jobs de test (y compris sur les PR) n'ont que la lecture.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Version publiée : 1.2.0, 1.2 et latest. Branche main : main et sha-<commit>, pour tester avant de publier.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0-dev' }}
      # Service facultatif de mise à jour en un clic (dossier mise-a-jour/), publié avec les mêmes étiquettes.
      - id: meta-maj
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-mise-a-jour
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: mise-a-jour
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-maj.outputs.tags }}
          labels: ${{ steps.meta-maj.outputs.labels }}

  archives:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Installation sans Docker (installation/) : archives Linux x64 et Windows x64 autonomes, jointes à chaque version publiée.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Front
        working-directory: frontend
        run: npm ci && npm run build
      - name: Archives
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0-dev; fi
          .github/scripts/archives.sh "$version" archives
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: archives/
          retention-days: 7

  publication:
    needs: [image, archives]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Crée la version GitHub que l'indicateur de mise à jour de l'application consulte.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: archives
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" archives/*
