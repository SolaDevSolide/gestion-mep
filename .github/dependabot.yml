# Mises à jour des dépendances, proposées par pull request chaque semaine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      front:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      back:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
