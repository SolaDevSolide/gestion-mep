# Mises à jour des dépendances, proposées par pull request chaque semaine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      front:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      back:
        update-types: [minor, patch]
    ignore:
      # Fixé à la série 1.0 (Apache 2.0) : les versions suivantes ne sont plus sous licence libre permissive,
      # et ClosedXML n'accepte pas la série 3 (voir GestionMep.Tableur.csproj).
      - dependency-name: SixLabors.Fonts

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    # Image de l'application et service de mise à jour
    directories: [/, /mise-a-jour]
    schedule:
      interval: weekly
